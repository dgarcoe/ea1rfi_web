server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    location /static/ { alias /srv/static/; }
    # Documents stay behind Wagtail's document permissions endpoint.
    location /media/documents/ { return 404; }
    location /media/ { alias /srv/media/; add_header X-Content-Type-Options nosniff; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This listener is loopback-only; the outer TLS proxy must overwrite this header.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
